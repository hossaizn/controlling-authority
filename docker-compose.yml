# Local development only. Production runs a single app container on Fly.io
# against Qdrant Cloud and Langfuse Cloud.
#
# Qdrant is the only service worth running locally: it holds the corpus and its
# filtering behaviour is what the retrieval tests assert against. Langfuse Cloud
# is used from local too, so development and demo traces land in one project.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships no HTTP client and no Python either. It is Debian-based
      # and has bash, so probe over /dev/tcp. Verified against the running
      # container: the previous Python probe exited 127 on every attempt and the
      # service sat "unhealthy" while serving correctly, which is worse than no
      # healthcheck at all.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 5
