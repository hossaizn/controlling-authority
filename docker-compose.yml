# Local development only. Production runs a single app container on Fly.io
# against Qdrant Cloud and Langfuse Cloud.
#
# Qdrant is the only service worth running locally: it holds the corpus and its
# filtering behaviour is what the retrieval tests assert against. Langfuse Cloud
# is used from local too, so development and demo traces land in one project.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant images ship without curl or wget, so probe from Python instead.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:6333/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
