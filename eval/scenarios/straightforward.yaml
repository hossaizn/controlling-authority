# Straightforward slice: one authority applies, nothing conflicts, all facts
# supplied. These exist to prove the system is not merely complicated, and to
# stop the agent treating every question as a trap. If accuracy here is not
# near-perfect, nothing in the harder slices means anything.

- scenario_id: straightforward-001
  slice: straightforward
  question: How many weeks of unpaid family and medical leave can I take in a year?
  employee_context: {state: OH, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: answer
  expected_authority: federal
  required_citations: ["29 CFR 825.200"]
  verified: false
  notes: Ohio adds nothing above the federal floor and the handbook restates it.

- scenario_id: straightforward-002
  slice: straightforward
  question: How much notice do I have to give before taking family leave?
  employee_context: {state: OH, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: answer
  expected_authority: federal
  required_citations: ["29 CFR 825.302"]
  verified: false
  notes: Thirty days where foreseeable. Handbook and regulation agree.

