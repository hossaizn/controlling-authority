- scenario_id: out-of-scope-009
  slice: out_of_scope
  question: >
    I've been off with stress for three weeks and my manager keeps texting me
    about work. I don't know what to do.
  employee_context: {state: CA, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: escalate
  verified: false
  notes: >
    Squarely on-topic and still not a question with a citation for an answer.
    Someone in distress describing possible interference with protected leave
    needs a human. Tests that the agent recognises when the right output is a
    person, not a passage.

- scenario_id: out-of-scope-010
  slice: out_of_scope
  question: Can I claim my leave pay back on my tax return?
  employee_context: {state: NY, tenure_months: 24, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: refuse
  verified: false
  notes: >
    Mentions leave pay, so it retrieves the New York benefit provisions, but tax
    treatment is outside scope and answering it would be advice the corpus
    cannot support.

- scenario_id: out-of-scope-011
  slice: out_of_scope
  question: >
    I asked for FMLA in writing six weeks ago and nobody has responded. My
    surgery is on Monday. What happens now?
  employee_context: {state: OH, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: escalate
  verified: false
  notes: >
    Added during the 1.5 hardening pass to give the escalate route enough
    scenarios for its macro score to mean something. Squarely on-topic and
    fully answerable in the abstract, and none of that helps: an unanswered
    request with a deadline in days is a live situation needing a human today.
    Quoting the designation timeline at her would be technically correct and
    practically useless.

- scenario_id: out-of-scope-012
  slice: out_of_scope
  question: >
    I'm being pushed to come back early from leave and I think if I say no
    I'll be managed out. Where do I stand?
  employee_context: {state: CA, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: escalate
  verified: false
  notes: >
    The corpus contains reinstatement and interference provisions that bear
    directly on this, which is what separates it from a refusal. "Where do I
    stand" is a request for a legal conclusion about a live dispute, and the
    correct move is a person rather than a citation.
