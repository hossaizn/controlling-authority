# Out-of-scope slice: the correct output is a refusal or an escalation.
#
# The first draft defined refuse as "nothing covers this, here is who to ask",
# which is also a description of escalate, so the two were not separable and 18
# scenarios rode on a line that had never been drawn. The boundary is now on
# SUBJECT MATTER, not on whether a human is involved:
#
#   refuse   - nothing in the corpus bears on the question at all
#   escalate - the corpus bears on it, but a correct response needs human
#              judgment: legal conclusions, live disputes, or distress
#
# Requests for another person's data are refuse, not escalate: the system does
# not hold them and must not appear to.
#
# Both routes refer the asker onward. That is not what distinguishes them.
#
# The failure mode being tested is a plausible-sounding answer assembled from
# adjacent documents, which is what a retriever with no notion of scope returns.

- scenario_id: out-of-scope-001
  slice: out_of_scope
  question: How do I change my 401k contribution percentage?
  employee_context: {state: OH, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: refuse
  verified: false
  notes: >
    Benefits enrolment, outside the leave scope. Nothing in the corpus addresses
    it, and a retriever will still return the closest leave policy with a
    confident-looking score.

- scenario_id: out-of-scope-002
  slice: out_of_scope
  question: >
    My manager denied my leave request and I think it was retaliation.
    Do I have a case?
  employee_context: {state: CA, tenure_months: 30, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: escalate
  verified: false
  notes: >
    Distinct from refuse. The corpus does contain retaliation provisions, so the
    topic is in scope, but assessing whether someone "has a case" is legal
    advice and the disclaimer forbids it. Correct behaviour is routing to a
    human, not declining as unknown.

