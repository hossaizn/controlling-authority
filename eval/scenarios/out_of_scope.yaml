- scenario_id: out-of-scope-006
  slice: out_of_scope
  question: I hurt my back loading a trailer. How do I file a workers comp claim?
  employee_context: {state: NY, tenure_months: 24, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: escalate
  verified: false
  notes: >
    The trap case of this slice. New York's Paid Family Leave provisions live
    inside the Workers' Compensation Law, so lexical retrieval will surface
    genuinely relevant-looking statute. Filing a comp claim is still not a leave
    question, and an injured employee needs a human, not a citation.

