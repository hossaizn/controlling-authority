    continuing during leave, so "health plan" retrieves confidently while
    answering nothing about plan design.

- scenario_id: out-of-scope-005
  slice: out_of_scope
  question: When do performance reviews happen and how does it affect my raise?
  employee_context: {state: OH, tenure_months: 18, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: refuse
  verified: false
  notes: >
