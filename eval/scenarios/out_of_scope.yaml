- scenario_id: out-of-scope-006
  slice: out_of_scope
  question: I hurt my back loading a trailer. How do I file a workers comp claim?
  employee_context: {state: NY, tenure_months: 24, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-04-01
  expected_route: refuse
  verified: false
  notes: >
    The trap case of this slice, and relabelled during the 1.5 hardening pass.
    New York's Paid Family Leave provisions live inside the Workers'
    Compensation Law, so lexical retrieval will surface genuinely
    relevant-looking statute. Under the sharpened boundary this is refuse rather
    than escalate: how to file a compensation claim is not a leave question, so
    nothing in the corpus bears on it. The original label leaned on "an injured
    employee needs a human", which is true of several refuse cases too and is
    therefore not what separates the routes.

