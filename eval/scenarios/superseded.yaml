- scenario_id: superseded-010
  slice: superseded
  question: What's the current sick leave policy?
  employee_context: {state: OH, tenure_months: 40, hours_worked_12mo: 2000, employer_size: 400}
  as_of_date: 2026-06-15
  expected_route: answer
  expected_authority: company
  required_citations: ["LEAVE-004-v2"]
  forbidden_citations: ["LEAVE-004-v1"]
  verified: false
  notes: >
    "Current" stated explicitly, with no date reasoning required from the
