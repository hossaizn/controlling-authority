# Ohio: recorded absences.
#
# Ohio is the control jurisdiction. It adds nothing above the federal floor on
# any topic the scenario set asks about, which is precisely why it is in the
# corpus: it is the case where the answer is "no", and "no" is a real answer.
#
# THESE ARE DOCUMENTS, NOT CONFIGURATION. Each becomes a retrievable
# SourceDocument with content_status "absent". A retrieval miss and a genuine
# absence must not look the same to the agent: one means "I could not find it",
# the other means "there is nothing to find, and that settles the question".
# Returning nothing for an Ohio family-leave query would leave the agent unable
# to tell those apart, and the honest answer is not silence.
#
# Scope note, and it is the plan's stopping rule working as intended: no
# scenario in the set cites an Ohio statute. All 46 Ohio scenarios resolve to
# federal law, the handbook, or an absence below. Ohio therefore needs no
# statutory adapter at all, which is a whole integration that the eval said was
# unnecessary before any of it was written.

- topic: family_medical_leave
  effect: federal_controls
  text: >
    Ohio has no state family and medical leave statute covering private
    employers. Eligibility, entitlement and job protection for family and
    medical leave in Ohio are governed by the federal Family and Medical Leave
    Act. Where an employer's own policy is more generous than the federal
    floor, the policy governs to that extent.
  verified_on: null

- topic: parental_leave
  effect: federal_controls
  text: >
    Ohio has no state bonding leave entitlement for employees of private
    employers and no state paid family leave benefit. Leave for the birth,
    adoption or foster placement of a child is governed by the federal Family
    and Medical Leave Act, or by an employer's own policy where that policy is
    more generous.

    Pregnancy is separately protected and is NOT an absence. Ohio Administrative
    Code Rule 4112-5-05(G), under the Civil Rights Act, provides that where an
    employee temporarily disabled by pregnancy or a related condition is
    terminated because a policy makes insufficient or no maternity leave
    available, that termination is unlawful sex discrimination. Leave for
    pregnancy-related disability therefore has a state source in Ohio; leave for
    bonding after a birth does not.
  verified_on: 2026-08-26

- topic: paid_sick_leave
  effect: employer_policy_controls
  text: >
    Ohio has no state paid sick leave statute requiring private employers to
    provide or accrue paid sick leave. Entitlement is whatever the employer's
    own policy provides.
  verified_on: null

- topic: vacation_forfeiture
  effect: employer_policy_controls
  text: >
    Ohio has no state statute prohibiting the forfeiture of accrued vacation or
    paid time off. A use-it-or-lose-it provision in an employer's policy is not
    displaced by Ohio law.

    Ohio does regulate vacation pay, and the distinction matters. Ohio Revised
    Code 4113.15(D)(2) defines "fringe benefits" for wage-payment purposes to
    include vacation, separation and holiday pay, and 4113.15(C) makes an
    employer party to an agreement to pay them a trustee of the funds that
    agreement requires. Ohio therefore ENFORCES the policy's own terms rather
    than overriding them: where a policy provides that days above a cap are
    forfeited, no obligation to pay arises and nothing is held in trust. This is
    the opposite of California, where Cal. Lab. Code 227.3 voids the forfeiture
    term itself.
  verified_on: 2026-08-26

- topic: bereavement_leave
  effect: employer_policy_controls
  text: >
    Ohio has no state bereavement leave entitlement for employees of private
    employers. Bereavement leave is whatever the employer's own policy provides.
  verified_on: null

# Added in Phase 3.5. Review found three Ohio scenarios resting on silence that
# was never recorded: straightforward-005 and -010 (jury and witness duty pay)
# and -015 (military leave). Each expects the handbook to control, which under
# precedence rule 5 requires that nothing else addresses the topic. Nothing did,
# and nothing said so.
#
# These are deliberately narrower than the records above. A broad claim that a
# state "has no X law" is easy to get wrong; a claim that no statute requires a
# private employer to PAY for a specific absence is narrower and closer to what
# the scenarios actually turn on.

- topic: jury_duty_pay
  effect: employer_policy_controls
  text: >
    Ohio has no statute requiring a private employer to pay an employee for time
    spent on jury service. Whether jury service is paid, and for how long, is
    governed by the employer's own policy.

    Scope is deliberate and load-bearing. Ohio Revised Code 2313.19, in Title 23
    (Courts) rather than Title 41, prohibits discharging or disciplining an
    employee summoned as a juror, and says nothing about payment. This record
    addresses payment only, which is why it survived a search that turned up a
    statute the original single-title sweep would have missed entirely.
  verified_on: 2026-08-26

- topic: witness_duty_pay
  effect: employer_policy_controls
  text: >
    Ohio has no statute requiring a private employer to pay an employee for time
    spent appearing as a witness under subpoena. Payment is governed by the
    employer's own policy. This record addresses payment only.
  verified_on: null

- topic: military_leave
  effect: employer_policy_controls
  text: >
    Ohio DOES have a military leave statute, and it adds nothing above the
    federal floor. Ohio Revised Code 5903.02(B) provides that any person whose
    absence from employment is necessitated by service in the uniformed services
    has the same reinstatement and reemployment rights under Ohio law as under
    the federal Uniformed Services Employment and Reemployment Rights Act. It
    names no employer category, so it is not confined to public employment.

    This is a state rule that deliberately tracks federal law rather than an
    absence. The practical effect is the same, but the reason differs: "no Ohio
    rule exists" and "Ohio's rule restates the federal one" are not the same
    statement, and only the second is true.

    USERRA itself is not in this corpus, which ingests only 29 CFR Part 825 at
    the federal layer, so within the corpus an employer policy exceeding the
    floor conflicts with nothing ingested.
  verified_on: 2026-08-26
